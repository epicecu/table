[package]
name = "table-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "table"
description = "Raw Rust bindings for the Table C lookup library"

[workspace]
resolver = "2"
members = ["rust/table", "tools/docs-api", "tools/rust-proto"]
default-members = [".", "rust/table"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/epicecu/table"

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
quote = "1"
roxmltree = "0.20"
syn = { version = "2", features = ["full"] }

[build-dependencies]
cc = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"

[lints]
workspace = true
